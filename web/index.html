<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Quest for AI</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#2a1f5c">
<!--
  The game page. EVERYTHING the player sees is drawn inside the TV screen by web/tv.js
  (power bars, pixel world, story dialog box, choices). This file only holds the TV case,
  the cute mushrooms around it, and the game flow (talking to /api).
  Works locally (python -m tqfai serve) and online (Vercel). The page never sees the AI key.
-->
<style>
  /* pixel fonts live in web/fonts (free, SIL Open Font License) */
  @font-face { font-family:"VT323"; src:url("fonts/vt323.woff2") format("woff2"); font-display:swap; }
  @font-face { font-family:"Press Start 2P"; src:url("fonts/press-start-2p.woff2") format("woff2"); font-display:swap; }
  :root { --sky1:#2a1f5c; --sky2:#3b2a7a; --sky3:#6a4bb0; --gpx:4px; --smile:1; --worry:0; }
  * { box-sizing:border-box; }
  html, body { height:100%; }
  body { margin:0; background:linear-gradient(180deg, var(--sky1) 0%, var(--sky2) 55%, var(--sky3) 100%);
         background-attachment:fixed; display:flex; align-items:center; justify-content:center; padding:10px; }

  /* the TV case: no text on it, just plastic, a speaker and knobs */
  .tv { position:relative; z-index:1; width:min(980px, 100%, calc(100vh - 70px)); min-width:min(100%, 320px);
        padding:16px 16px 14px; border-radius:26px; background:linear-gradient(180deg,#5a4632,#2e2318);
        box-shadow:0 18px 50px rgba(0,0,0,.5), inset 0 2px 0 rgba(255,255,255,.15); }
  .screen { position:relative; border-radius:16px; overflow:hidden; background:#000; box-shadow:0 0 0 4px #120d08, inset 0 0 30px #000; }
  .screen::after { content:""; position:absolute; inset:0; pointer-events:none;
                   background:radial-gradient(ellipse at center, transparent 62%, rgba(0,0,0,.35) 100%); }
  canvas#tv { display:block; width:100%; aspect-ratio:1/1; image-rendering:pixelated; touch-action:none; }
  .case { display:flex; justify-content:space-between; align-items:center; margin-top:10px; height:18px; }
  .grill { width:90px; height:12px; background:repeating-linear-gradient(90deg,#1a130c 0 4px,transparent 4px 8px); border-radius:3px; }
  .knobs i { display:inline-block; width:16px; height:16px; border-radius:50%; background:#1a130c; margin-left:8px; box-shadow:inset 0 2px 3px rgba(255,255,255,.2); }
  .sr { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); }

  /* cute mushrooms around the TV (our own SVG art) */
  #shrooms { position:fixed; inset:0; z-index:0; pointer-events:none; overflow:hidden; }
  #shrooms svg.m { position:absolute; filter:drop-shadow(0 0 var(--gpx) rgba(126,249,212,.75)); transition:filter .8s;
                   animation:bob 4s ease-in-out infinite; transform-origin:50% 100%; }
  body.tense #shrooms svg.m { animation:shiver .35s linear infinite; filter:drop-shadow(0 0 3px rgba(255,143,163,.6)); }
  @keyframes bob { 0%,100% { transform:translateY(0) } 50% { transform:translateY(-6px) } }
  @keyframes shiver { 0%,100% { transform:rotate(-1.5deg) } 50% { transform:rotate(1.5deg) } }
  @media (prefers-reduced-motion: reduce) { #shrooms svg.m { animation:none !important; } }
  .star { position:absolute; width:3px; height:3px; border-radius:50%; background:#fff; opacity:.6; }
  @media (max-width:600px) { body { align-items:flex-start; } }
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="shroom" viewBox="0 0 100 110">
    <path d="M30 56 L70 56 Q78 104 66 105 L34 105 Q22 104 30 56Z" fill="#fff4e3" stroke="#3a2546" stroke-width="3"/>
    <path d="M6 54 Q6 6 50 6 Q94 6 94 54 Q94 62 85 62 L15 62 Q6 62 6 54Z" fill="currentColor" stroke="#3a2546" stroke-width="3"/>
    <path d="M14 30 Q26 14 44 11" fill="none" stroke="#fff" stroke-opacity=".45" stroke-width="4" stroke-linecap="round"/>
    <circle cx="30" cy="32" r="7" fill="#fff" fill-opacity=".92"/><circle cx="58" cy="20" r="5" fill="#fff" fill-opacity=".92"/>
    <circle cx="74" cy="40" r="8" fill="#fff" fill-opacity=".92"/><circle cx="48" cy="46" r="4" fill="#fff" fill-opacity=".92"/>
    <ellipse cx="41" cy="77" rx="4.5" ry="5.5" fill="#2a1b33"/><ellipse cx="59" cy="77" rx="4.5" ry="5.5" fill="#2a1b33"/>
    <circle cx="42.6" cy="75" r="1.6" fill="#fff"/><circle cx="60.6" cy="75" r="1.6" fill="#fff"/>
    <ellipse cx="34" cy="86" rx="5" ry="3" fill="#ff8fb1" fill-opacity=".6"/><ellipse cx="66" cy="86" rx="5" ry="3" fill="#ff8fb1" fill-opacity=".6"/>
    <path d="M45 85 Q50 90 55 85" fill="none" stroke="#2a1b33" stroke-width="2.5" stroke-linecap="round" style="opacity:var(--smile,1)"/>
    <path d="M45 89 Q50 84 55 89" fill="none" stroke="#2a1b33" stroke-width="2.5" stroke-linecap="round" style="opacity:var(--worry,0)"/>
  </symbol>
</svg>
<div id="shrooms" aria-hidden="true"></div>

<div class="tv">
  <div class="screen">
    <canvas id="tv" tabindex="0" aria-label="The Quest for AI game screen. Space for next, 1 to 4 to choose."></canvas>
  </div>
  <div class="case"><span class="grill"></span><span class="knobs"><i></i><i></i></span></div>
  <div id="tv-live" class="sr" aria-live="polite"></div>
</div>

<script src="tv.js"></script>
<script>
// Same address as the page when online or local; localhost if opened as a file.
const API = (new URLSearchParams(location.search).get("api") || (location.protocol === "file:" ? "http://127.0.0.1:8787" : "")) + "/api";
let save = null;   // the game save lives here, in the browser only
let helperName = "Helper";

// ---- cute mushrooms around the TV ----
(function drawBackground() {
  const wrap = document.getElementById("shrooms");
  for (let i = 0; i < 40; i++) {
    const s = document.createElement("i"); s.className = "star";
    s.style.left = Math.random() * 100 + "%"; s.style.top = Math.random() * 60 + "%";
    s.style.opacity = (0.2 + Math.random() * 0.6).toFixed(2); wrap.append(s);
  }
  for (const [left, bottom, size, color, delay] of [
    [-3, -10, 150, "#ff7aa8", 0], [9, -14, 90, "#7cc8ff", 1.2], [80, -12, 160, "#b48cff", .8],
    [92, 110, 70, "#7ef9d4", 2.1], [-2, 230, 80, "#ffd166", 1.4], [60, -12, 55, "#8be0ff", .3]]) {
    const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
    svg.setAttribute("class", "m"); svg.setAttribute("viewBox", "0 0 100 110");
    Object.assign(svg.style, { left: left + "%", bottom: bottom + "px", width: size + "px", color, animationDelay: delay + "s" });
    const use = document.createElementNS("http://www.w3.org/2000/svg", "use"); use.setAttribute("href", "#shroom");
    svg.append(use); wrap.append(svg);
  }
})();

function setMood(state) {
  const tense = (state.entropy ?? 0) >= 4;
  document.body.classList.toggle("tense", tense);
  document.body.style.setProperty("--smile", tense ? 0 : 1);
  document.body.style.setProperty("--worry", tense ? 1 : 0);
  document.body.style.setProperty("--gpx", (3 + (state.connection ?? 0) * 3) + "px");
}

async function call(method, path, body) {
  const r = await fetch(API + path, { method, headers: { "Content-Type": "application/json" }, body: body && JSON.stringify(body) });
  const j = await r.json();
  if (!r.ok) throw new Error(j.error || "Something went wrong");
  return j;
}

// Split long story text into short pages that fit the dialog box.
function paginate(text, max = 200) {
  const out = [];
  for (const para of text.split(/\n\s*\n/)) {
    let cur = "";
    for (const s of para.match(/[^.!?]+[.!?]+["')]*\s*|[^.!?]+$/g) || [para]) {
      if ((cur + s).length > max && cur) { out.push(cur.trim()); cur = ""; }
      cur += s;
    }
    if (cur.trim()) out.push(cur.trim());
  }
  return out;
}
const speakerOf = text => (text.match(/^(Sam|Max|Mia|GlowKing_99|Hoot)\b/) || [])[1] || null;

// ---- game flow ----
async function menu() {
  save = null;
  const state = { entropy: 0, connection: 3 };
  setMood(state);
  const [{ companions }, { scenarios }] = await Promise.all([call("GET", "/companions"), call("GET", "/scenarios")]);
  const sc = scenarios[0];
  TV.play({
    world: { sceneId: "menu", state, history: [] },
    part: "The Quest for AI",
    pages: [
      { who: sc.title, kind: "narrator", text: sc.summary },
      { who: "How to play", kind: "narrator", text: "Walk your orange mushroom (YOU) to a numbered sign and press SPACE. Or press 1, 2, 3, 4. Or click. Kind choices make the roots under the ground glow." },
    ],
    choicesTitle: "Pick your AI helper",
    choices: companions.map(c => ({ label: `${c.name}: ${c.title}`, sub: c.style, pick: () => start(sc.id, c) })),
  });
}

async function start(scenarioId, companion) {
  helperName = companion.name;
  TV.setBusy(helperName);
  try { render(await call("POST", "/start", { scenario_id: scenarioId, companion_id: companion.id })); }
  catch (e) { TV.error(e.message); }
}

async function choose(id) {
  TV.setBusy(helperName);
  try { render(await call("POST", "/choose", { save, choice_id: id })); }
  catch (e) { TV.error(e.message); }
}

function render(v) {
  save = v.save;
  setMood(v.state);
  const world = { sceneId: v.finished ? "ending" : v.scene.id, state: v.state, history: v.save.history, ending: v.ending };
  const pages = [];
  if (v.last) {
    const who = speakerOf(v.last.reaction || "");
    if (v.last.reaction) pages.push({ who: who || "What happens", kind: who ? "" : "narrator", text: v.last.reaction });
    pages.push({ who: v.companion.name, kind: "helper", text: v.last.companion_note });
  }
  if (v.finished) {
    const e = v.ending;
    pages.push(...paginate(e.text).map(t => ({ who: e.title, kind: "narrator", text: t })));
    TV.play({ world, part: "The End", pages, choicesTitle: "Things to think about",
              notes: e.reflection_questions, choices: [{ label: "Play again", pick: menu }] });
    return;
  }
  const s = v.scene;
  let text = s.text, part;
  const m = text.match(/^Part (\d+): ([^.]+)\.\s*/);
  if (m) { part = `${m[1]}/5 ${m[2]}`; text = text.slice(m[0].length); }
  const who = s.speaker === "narrator" ? "Story" : s.speaker === "WiseOwl" ? "Hoot the owl" : s.speaker;
  pages.push(...paginate(text).map(t => ({ who, kind: s.speaker === "narrator" ? "narrator" : "", text: t })));
  if (s.companion_line) pages.push({ who: v.companion.name, kind: "helper", text: s.companion_line });
  TV.play({ world, part, pages, choicesTitle: "What do you do?",
            choices: s.choices.map(c => ({ label: c.text, pick: () => choose(c.id) })) });
}

menu().catch(e => TV.error(`${e.message}. Is the game server running?`));
</script>
</body>
</html>
