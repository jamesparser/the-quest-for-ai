name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Validate scenarios
        run: PYTHONPATH=src python -m tqfai validate
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: MeTTa structure check (legacy script)
        run: python test_metta.py
      - name: Reasoner evaluation (decision gate report)
        run: PYTHONPATH=src python -m tqfai eval
